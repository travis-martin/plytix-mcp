# Template only. Replace verified HTTPS service URL and absolute private paths.
# Native helper authenticates directly to private Cloud Run; no local proxy needed.
# Use an existing approved developer gcloud account with service invocation access.
# The helper emits credentials only to Codex's private pipe. Never run it manually
# without --check, print its output, or add credential values to this template.
[mcp_servers.plytix_remote]
url = "https://VERIFIED-CLOUD-RUN-HOST/mcp"
enabled = false
default_tools_approval_mode = "writes"
startup_timeout_sec = 30
tool_timeout_sec = 120
http_headers_helper = 'node "C:/ABSOLUTE/PATH/plytix-mcp/scripts/cloud-run-headers.mjs" --env-file "C:/PRIVATE/PATH/.env" --account "operator@example.com" --gcloud "C:/ABSOLUTE/PATH/Google/Cloud SDK/google-cloud-sdk/bin/gcloud.cmd"'
# Do not configure bearer_token_env_var or OAuth credentials for this connection:
# explicit Authorization would override the helper's refreshed Google ID token.
